<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Semainier du prof</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semainier">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9ecef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout : une semaine en colonne de jours, cartes de cours ouvrant une feuille de saisie ; barre d'onglets en bas */
:root{
  --bg:#e9ecef; --surface:#ffffff; --surface2:#f4f6f8; --fg:#1c2127; --muted:#5d6670; --line:#d5dbe1;
  --accent:#e4572e; --accent-ink:#ffffff;
  --ok:#2e8f62; --warn:#c7820a; --bad:#c8432b;
  --c-sortie:#2e8f62; --c-conseil:#7356cf; --c-admin:#b77a06;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16191d; --surface:#22272d; --surface2:#2a3037; --fg:#eef1f4; --muted:#9aa4ae; --line:#353c44;
  --accent:#ff6a3d; --accent-ink:#1a0d07; --ok:#4cc08a; --warn:#e6a22c; --bad:#f06a4f;
  --c-sortie:#4cc08a; --c-conseil:#9c84f0; --c-admin:#e6a22c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16191d; --surface:#22272d; --surface2:#2a3037; --fg:#eef1f4; --muted:#9aa4ae; --line:#353c44;
  --accent:#ff6a3d; --accent-ink:#1a0d07; --ok:#4cc08a; --warn:#e6a22c; --bad:#f06a4f;
  --c-sortie:#4cc08a; --c-conseil:#9c84f0; --c-admin:#e6a22c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:8px}
h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:22px 0 8px}
.weekbar{display:flex;align-items:center;gap:8px}
.weekbar .lbl{flex:1;min-width:0}
.weekbar .dates{font-size:13px;color:var(--muted)}
.ab{font-family:var(--display);font-weight:800;font-size:15px;border:2px solid var(--fg);border-radius:8px;padding:2px 9px;background:transparent}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center}
.day{margin-top:18px}
.dayhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.dayhead b{font-family:var(--display);font-size:17px;font-weight:700;text-transform:capitalize}
.dayhead span{color:var(--muted);font-size:13px}
.dayhead.today b{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.card.cancel{opacity:.6}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;min-width:92px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;color:#fff}
.pill{display:inline-flex;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mut{color:var(--muted)}
.sum{font-size:13.5px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.sum dt{font-weight:700;color:var(--fg)} .sum dd{margin:0;min-width:0}
.todo{color:var(--fg)}
.task{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:12px;padding:9px 12px;border:1px dashed var(--line);width:100%;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.cat-sortie{background:var(--c-sortie)} .cat-conseil{background:var(--c-conseil)} .cat-admin{background:var(--c-admin)}
.empty{color:var(--muted);font-size:13.5px;padding:4px 2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;border:0;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:13px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.note{font-size:12.5px;color:var(--muted)}
/* feuille */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-family:var(--display);font-size:21px;margin:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:8px;align-items:center;font-size:14px}
.steps .n{font-family:var(--display);font-weight:800;width:28px;flex:none}
.steps .t{flex:1;min-width:0}
.steps li.done .t{text-decoration:line-through;color:var(--muted)}
.steps li.cur .n,.steps li.cur .t{color:var(--accent);font-weight:700}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.steprow{display:grid;grid-template-columns:1fr 64px auto;gap:6px;align-items:center}
.hist{font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.hist div{border-left:2px solid var(--line);padding-left:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.steps-on{display:flex;flex-direction:column;gap:10px;counter-reset:n}
.onb{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;width:100%;text-align:left}
.onb .k{font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent);width:22px;flex:none;line-height:1}
.onb.ok .k{color:var(--ok)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{font-size:12.5px;background:var(--surface2);border-radius:10px;padding:8px 10px;color:var(--muted)}
/* tablette : jours côte à côte, fenêtres centrées */
.weekgrid{display:block}
@media (min-width:700px){
  .wrap.wide{max-width:1240px} .wrap{max-width:760px}
  .weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 18px;align-items:start}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
  .cgrid .box{margin-top:0!important}
  .steps-on{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .scrim{align-items:center;padding:24px}
  .sheet{max-width:600px;max-height:88%;border-radius:20px}
  nav.tabs{justify-content:center} nav.tabs button{flex:0 1 160px}
}
@media (min-width:1000px){
  .weekgrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:0 12px}
  .weekgrid .card{padding:10px}
  .weekgrid .time{min-width:0}
  .weekgrid .sum{grid-template-columns:1fr}
  .weekgrid .sum dt{margin-top:4px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="layer"></div>

<script>
(function(){
"use strict";
const KEY="semainier-prof-v2";
const DAYS=["","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const COLORS=["#e4572e","#2b7bb9","#2e8f62","#7356cf","#c2410c","#0f8b8d","#b8336a","#5b6b1f"];
const CATS={sortie:"Sortie",conseil:"Conseil de classe",admin:"Administratif"};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const mondayOf=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const dow=s=>{const w=parse(s).getDay();return w===0?7:w};
const fmtShort=s=>parse(s).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const fmtDay=s=>parse(s).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const TODAY=iso(new Date());
const startWeek=()=>{const d=dow(TODAY);return d>=6?addDays(mondayOf(TODAY),7):mondayOf(TODAY)};

/* ---------- état vierge ---------- */
const blank=()=>({settings:{refMonday:startWeek(),refType:"A",flip:{}},sequences:[],classes:[],slots:[],logs:[],tasks:[]});
let S;
try{const raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):null}catch(e){S=null}
if(!S||!S.settings)S=blank();

/* ---------- enregistrement : compte claude.ai si possible, sinon appareil ---------- */
let col=null, syncState="local", syncNote="";
const lastWritten={}, chains={};
function docsFromState(){
  const out={config:{settings:S.settings,sequences:S.sequences,classes:S.classes,slots:S.slots,tasks:S.tasks}};
  S.logs.forEach(l=>{const k="w-"+mondayOf(l.date);(out[k]=out[k]||{logs:[]}).logs.push(l)});
  Object.keys(lastWritten).forEach(k=>{if(!out[k])out[k]={logs:[]}});
  return out;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(!col)return;
  const docs=docsFromState();
  Object.entries(docs).forEach(([k,body])=>{
    const json=JSON.stringify(body);if(lastWritten[k]===json)return;lastWritten[k]=json;
    chains[k]=(chains[k]||Promise.resolve()).then(()=>col.doc(k).set(JSON.parse(json))).catch(e=>{
      syncNote=e&&e.code==="quota_exceeded"?"L'espace de stockage du compte est plein. Copiez une sauvegarde.":"Un enregistrement n'a pas abouti. Les données restent sur cet appareil.";
      if(tab==="reglages")render()});
  });
}
async function connect(){
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user){render();return}
  const id=await user.id();if(!id){render();return}
  col=db.collection("data/users/"+id);
  syncState="loading";
  let first=true;
  const timer=setTimeout(()=>{if(syncState==="loading"){syncNote="Le compte ne répond pas encore. Vos saisies restent sur cet appareil.";render()}},10000);
  col.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(!snap.metadata.fromCache){clearTimeout(timer);syncState="cloud";syncNote=""}
    if(snap.empty){
      if(first&&!snap.metadata.fromCache){first=false;save()}  // première fois : on envoie ce qui est sur l'appareil
      render();return;
    }
    const next=blank();next.logs=[];
    snap.docs.forEach(d=>{const b=d.data()||{};lastWritten[d.id]=JSON.stringify(b);
      if(d.id==="config")Object.assign(next,{settings:b.settings||next.settings,sequences:b.sequences||[],classes:b.classes||[],slots:b.slots||[],tasks:b.tasks||[]});
      else if(d.id.startsWith("w-"))next.logs.push(...(b.logs||[]));});
    if(!snap.docs.some(d=>d.id==="config")){first=false;save();return}
    first=false;S=next;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    render();
  },()=>{clearTimeout(timer);syncState="local";syncNote="La synchronisation est indisponible. Vos saisies restent sur cet appareil.";render()});
}

/* ---------- logique ---------- */
function weekType(mon){const n=Math.round((parse(mon)-parse(S.settings.refMonday))/864e5/7);
  let t=(Math.abs(n)%2===0)?S.settings.refType:(S.settings.refType==="A"?"B":"A");
  if(S.settings.flip&&S.settings.flip[mon])t=t==="A"?"B":"A";return t}
const cls=id=>S.classes.find(c=>c.id===id);
const seqOf=c=>c&&S.sequences.find(q=>q.id===c.seqId);
const slotById=id=>S.slots.find(s=>s.id===id);
const cancelTask=(slotId,date)=>S.tasks.find(t=>t.slotId===slotId&&t.date===date);

function progress(classId,before){
  const c=cls(classId),q=seqOf(c);if(!q)return null;
  const ids=new Set(q.steps.map(s=>s.id));
  const logs=S.logs.filter(l=>l.classId===classId&&!l.cancelled&&(!before||l.date<before)&&!cancelTask(l.slotId,l.date)&&l.steps.some(x=>ids.has(x.stepId))).sort((a,b)=>a.date.localeCompare(b.date));
  const real={},done={};
  logs.forEach(l=>l.steps.forEach(x=>{real[x.stepId]=(real[x.stepId]||0)+1;if(x.done)done[x.stepId]=true}));
  let curIdx=q.steps.findIndex(s=>!done[s.id]);const finished=curIdx===-1;if(finished)curIdx=q.steps.length;
  let ecart=0;
  q.steps.forEach((s,i)=>{const r=real[s.id]||0;if(done[s.id])ecart+=r-s.prevu;else if(i===curIdx)ecart+=Math.max(0,r-s.prevu)});
  return {q,logs,real,done,curIdx,finished,cur:q.steps[curIdx],ecart,last:logs[logs.length-1]};
}
function ecartPill(e){if(e===0)return '<span class="pill ok">Dans les temps</span>';
  if(e>0)return `<span class="pill ${e>1?"bad":"warn"}">+${e} séance${e>1?"s":""}</span>`;
  return `<span class="pill ok">${-e} séance${e<-1?"s":""} d'avance</span>`}
function stepLabel(q,id){const i=q.steps.findIndex(s=>s.id===id);return i<0?"Étape supprimée":`S${i+1} ${q.steps[i].title}`}

/* ---------- interface ---------- */
let tab="semaine", weekMon=startWeek();
const app=document.getElementById("app"),layer=document.getElementById("layer"),tabsEl=document.getElementById("tabs");
const ICONS={
 semaine:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
 classes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h10M4 19h6"/><circle cx="19" cy="17" r="3"/></svg>',
 taches:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
 reglages:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>'};
function renderTabs(){
  const T=[["semaine","Semaine"],["classes","Séquences"],["taches","Tâches"],["reglages","Réglages"]];
  tabsEl.innerHTML=T.map(([k,l])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':""}>${ICONS[k]}${l}</button>`).join("");
}
function render(){app.className="wrap"+(tab==="semaine"||tab==="classes"?" wide":"");renderTabs();({semaine:rWeek,classes:rClasses,taches:rTasks,reglages:rSettings})[tab]();}

function onboarding(){
  const a=S.classes.length>0,b=S.sequences.length>0&&S.classes.some(c=>c.seqId),c=S.slots.length>0;
  const it=(ok,k,t,d,act)=>`<button class="onb ${ok?"ok":""}" data-act="${act}"><span class="k">${ok?"✓":k}</span><span style="flex:1;min-width:0"><b>${t}</b><br><span class="note">${d}</span></span></button>`;
  return `<h2>Pour commencer</h2><div class="steps-on">
   ${it(a,1,"Ajouter vos classes","Nom, niveau et couleur de chaque classe.","newclass")}
   ${it(b,2,"Importer ou créer une séquence","À partir de votre fiche : Claude propose les étapes, vous vérifiez.","importseq")}
   ${it(c,3,"Saisir l'emploi du temps","Créneaux de la semaine A, de la semaine B ou des deux.","gotoslots")}
  </div>`;
}

function rWeek(){
  const type=weekType(weekMon);
  let h=`<header class="top"><div class="weekbar">
    <button class="iconbtn" data-act="prev" aria-label="Semaine précédente">‹</button>
    <div class="lbl"><h1>Semaine <button class="ab" data-act="flip" title="Inverser A/B pour cette semaine">${type}</button></h1>
    <div class="dates">du ${fmtShort(weekMon)} au ${fmtShort(addDays(weekMon,4))}</div></div>
    <button class="iconbtn" data-act="today" aria-label="Revenir à cette semaine">●</button>
    <button class="iconbtn" data-act="next" aria-label="Semaine suivante">›</button></div></header>`;
  const ready=S.classes.length&&S.slots.length&&S.classes.some(c=>c.seqId);
  if(!ready)h+=onboarding();
  if(S.slots.length||S.tasks.length){
    h+=`<div class="weekgrid">`;
    for(let d=1;d<=6;d++){
      const date=addDays(weekMon,d-1);
      const slots=S.slots.filter(s=>s.day===d&&(s.week==="AB"||s.week===type));
      const tasks=S.tasks.filter(t=>t.date===date);
      if(d===6&&!slots.length&&!tasks.length)continue;
      const items=[...slots.map(s=>({k:s.start,s})),...tasks.filter(t=>!t.slotId).map(t=>({k:t.start||"99",t}))].sort((a,b)=>a.k.localeCompare(b.k));
      h+=`<section class="day"><div class="dayhead ${date===TODAY?"today":""}"><b>${DAYS[d]}</b><span>${fmtShort(date)}</span></div><div class="list">`;
      if(!items.length)h+=`<div class="empty">Rien de prévu.</div>`;
      items.forEach(it=>{h+=it.s?slotCard(it.s,date):taskRow(it.t)});
      h+=`</div></section>`;
    }
    h+=`</div>`;
  }
  h+=`<button class="fab" data-act="newtask">+ Tâche</button>`;
  app.innerHTML=h;
}
function slotCard(s,date){
  const c=cls(s.classId);if(!c)return"";
  const ct=cancelTask(s.id,date);
  const log=S.logs.find(l=>l.slotId===s.id&&l.date===date);
  const p=progress(c.id,date);
  let body="";
  if(ct||(log&&log.cancelled)){
    body=`<div class="sum"><dt>Non assuré</dt><dd>${ct?esc(ct.title):esc(log.note||"Cours annulé")}</dd></div>`;
  }else if(!p){
    body=`<div class="sum"><dt>Séquence</dt><dd>Aucune séquence associée à cette classe</dd></div>`;
  }else{
    const last=p.last;
    const lastTxt=last?`${fmtDay(last.date)} · ${last.steps.map(x=>stepLabel(p.q,x.stepId)+(x.done?" (terminée)":" (en cours)")).join(", ")}${last.note?` · <i>${esc(last.note)}</i>`:""}`:"Début de séquence";
    let todo;
    if(p.finished)todo="Séquence terminée : associer la suivante";
    else{const r=p.real[p.cur.id]||0;todo=`${r?"Poursuivre":"Démarrer"} S${p.curIdx+1} ${esc(p.cur.title)} · séance ${r+1}/${p.cur.prevu}`}
    body=`<dl class="sum"><dt>Avant</dt><dd>${lastTxt}</dd><dt>À faire</dt><dd class="todo">${todo}</dd>`;
    if(log)body+=`<dt>Fait</dt><dd class="todo">${log.steps.map(x=>stepLabel(p.q,x.stepId)+(x.done?" ✓":"")).join(", ")}${log.note?" · "+esc(log.note):""}</dd>`;
    body+=`</dl>`;
  }
  return `<button class="card ${ct||(log&&log.cancelled)?"cancel":""}" data-act="course" data-slot="${s.id}" data-date="${date}">
    <div class="row"><span class="time">${s.start}–${s.end}</span><span class="chip" style="background:${c.color}">${esc(c.name)}</span>
    <span class="note">${esc(s.room)}${s.week!=="AB"?(s.room?" · ":"")+"sem. "+s.week:""}</span>
    <span style="margin-left:auto">${log&&!log.cancelled?'<span class="pill ok">Saisi</span>':(p&&!ct&&p.logs.length?ecartPill(p.ecart):"")}</span></div>${body}</button>`;
}

function open(html,bind){layer.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;bind&&bind(layer.querySelector(".sheet"))}
function close(){layer.innerHTML=""}
function seg(name,opts,val){return `<div class="seg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${v===val?"on":""}">${l}</button>`).join("")}</div>`}
function segVal(root,name){const b=root.querySelector(`[data-seg="${name}"] .on`);return b&&b.dataset.v}
function segWire(root,after){root.addEventListener("click",e=>{const b=e.target.closest("[data-seg] button");if(b){b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));after&&after()}})}
const head=t=>`<div class="row"><h3 style="flex:1">${t}</h3><button class="iconbtn" data-act="close" aria-label="Fermer">✕</button></div>`;

function courseSheet(slotId,date){
  const s=slotById(slotId),c=cls(s.classId),p=progress(c.id,date),q=p&&p.q;
  const log=S.logs.find(l=>l.slotId===slotId&&l.date===date);
  const ct=cancelTask(slotId,date);
  let h=`<div class="row"><span class="chip" style="background:${c.color}">${esc(c.name)}</span><h3 style="flex:1">${fmtDay(date)} · ${s.start}</h3><button class="iconbtn" data-act="close" aria-label="Fermer">✕</button></div>`;
  if(!q){open(h+`<div class="empty">Associez d'abord une séquence à cette classe.</div><button class="btn pri" data-act2="editclass">Choisir la séquence de ${esc(c.name)}</button>`,root=>{root.querySelector("[data-act2]").onclick=()=>classSheet(c.id)});return}
  if(ct){open(h+`<div class="box"><b>Cours remplacé par une tâche</b><div>${esc(ct.title)} (${CATS[ct.cat]})</div><div class="note">Cette séance ne compte pas dans la progression.</div></div>`);return}
  const cur=p.cur;
  h+=`<div class="box"><div class="row"><b style="flex:1">${esc(q.title)}</b>${p.logs.length?ecartPill(p.ecart):""}</div>`;
  if(cur)h+=`<div><b>S${p.curIdx+1} ${esc(cur.title)}</b> · séance ${(p.real[cur.id]||0)+1}/${cur.prevu}</div>${cur.contenu?`<div class="note">${esc(cur.contenu)}</div>`:""}`;
  else h+=`<div>Séquence terminée.</div>`;
  h+=`</div>`;
  const first=log&&!log.cancelled?log.steps[0]:null, second=log&&!log.cancelled&&log.steps[1];
  const selStep=first?first.stepId:(cur?cur.id:q.steps[q.steps.length-1].id);
  const opts=q.steps.map((st,i)=>`<option value="${st.id}" ${st.id===selStep?"selected":""}>S${i+1} ${esc(st.title)}</option>`).join("");
  h+=seg("assure",[["oui","Cours assuré"],["non","Non assuré"]],log&&log.cancelled?"non":"oui");
  h+=`<div id="fOui" class="stack"><label class="f">Étape travaillée<select id="fStep">${opts}</select></label>
   ${seg("etat",[["cours","En cours"],["fini","Terminée"]],first&&first.done?"fini":"cours")}
   <label class="check" id="fNextWrap"><input type="checkbox" id="fNext" ${second?"checked":""}> L'étape suivante a été commencée</label></div>
   <label class="f">Note<textarea id="fNote" placeholder="Ce qui a été fait, élèves à suivre, matériel…">${esc(log?log.note:"")}</textarea></label>
   <div class="row"><button class="btn pri" id="fSave" style="flex:1">Enregistrer</button>${log?`<button class="btn danger" id="fDel">Effacer</button>`:""}</div>`;
  const hist=S.logs.filter(l=>l.classId===c.id&&l.date<date).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  if(hist.length){h+=`<h2 style="margin:6px 0 0">Dernières séances</h2><div class="hist">`;
    hist.forEach(l=>{h+=`<div><b>${fmtDay(l.date)}</b> · ${l.cancelled?"Non assuré":l.steps.map(x=>stepLabel(q,x.stepId)+(x.done?" ✓":"")).join(", ")}${l.note?`<br><span class="note">${esc(l.note)}</span>`:""}</div>`});h+=`</div>`}
  open(h,root=>{
    const sync=()=>{const a=segVal(root,"assure")==="oui";root.querySelector("#fOui").hidden=!a;
      const fin=segVal(root,"etat")==="fini";const sel=root.querySelector("#fStep");
      root.querySelector("#fNextWrap").hidden=!(fin&&sel.selectedIndex<q.steps.length-1)};
    segWire(root,sync);root.querySelector("#fStep").onchange=sync;sync();
    root.querySelector("#fSave").onclick=()=>{
      const a=segVal(root,"assure")==="oui",note=root.querySelector("#fNote").value.trim();
      const entry={id:log?log.id:uid(),date,slotId,classId:c.id,cancelled:!a,steps:[],note};
      if(a){const sel=root.querySelector("#fStep"),fin=segVal(root,"etat")==="fini";
        entry.steps.push({stepId:sel.value,done:fin});
        if(fin&&root.querySelector("#fNext").checked&&sel.selectedIndex<q.steps.length-1)entry.steps.push({stepId:q.steps[sel.selectedIndex+1].id,done:false});}
      S.logs=S.logs.filter(l=>l.id!==entry.id);S.logs.push(entry);save();close();render();};
    const del=root.querySelector("#fDel");if(del)del.onclick=()=>{S.logs=S.logs.filter(l=>l.id!==log.id);save();close();render()};
  });
}

function seqSheet(id,draft){
  const orig=id&&S.sequences.find(q=>q.id===id);
  const q=orig?JSON.parse(JSON.stringify(orig)):(draft||{id:uid(),level:"",title:"",steps:[{id:uid(),title:"",prevu:1,contenu:""}]});
  if(!q.id)q.id=uid();q.steps.forEach(s=>{if(!s.id)s.id=uid()});
  const linked=new Set(S.classes.filter(c=>c.seqId===q.id).map(c=>c.id));
  const draw=root=>{
    const box=root.querySelector("#stepsBox");
    box.innerHTML=q.steps.map((s,i)=>`<div class="box" data-i="${i}"><div class="steprow"><input type="text" data-k="title" value="${esc(s.title)}" placeholder="S${i+1} intitulé" aria-label="Intitulé de l'étape ${i+1}">
      <input type="number" min="1" data-k="prevu" value="${s.prevu}" aria-label="Séances prévues"><button class="btn sm" data-del="${i}" aria-label="Supprimer l'étape">✕</button></div>

    box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{q.steps.splice(+b.dataset.del,1);draw(root)});
  };
  const matching=S.classes.filter(c=>!draft||!q.level||c.level===q.level||linked.has(c.id));
  const h=head(orig?"Séquence de référence":draft?"Vérifier la séquence importée":"Nouvelle séquence")+
  (draft?`<div class="banner">Proposition tirée de votre fiche. Corrigez les étapes et le nombre de séances avant d'enregistrer.</div>`:"")+
  `<div class="grid2"><label class="f">Niveau<input type="text" id="qLevel" value="${esc(q.level)}" placeholder="5e"></label><label class="f">Titre<input type="text" id="qTitle" value="${esc(q.title)}"></label></div>

  <div id="stepsBox" class="stack"></div><button class="btn" id="qAdd">+ Étape</button>
  <h2 style="margin:6px 0 0">Classes qui suivent cette séquence</h2>
  <div class="stack" id="qCls">${S.classes.length?S.classes.map(c=>`<label class="check"><input type="checkbox" value="${c.id}" ${linked.has(c.id)||(draft&&q.level&&c.level===q.level&&!c.seqId)?"checked":""}> <span class="chip" style="background:${c.color}">${esc(c.name)}</span>${c.seqId&&c.seqId!==q.id?`<span class="note">remplace « ${esc((S.sequences.find(x=>x.id===c.seqId)||{}).title||"")} »</span>`:""}</label>`).join(""):`<div class="empty">Aucune classe pour l'instant. Vous pourrez la relier depuis la fiche de la classe.</div>`}</div>
  <div class="row"><button class="btn pri" id="qSave" style="flex:1">Enregistrer</button>${orig?`<button class="btn danger" id="qDel">Supprimer</button>`:""}</div>`;
  open(h,root=>{draw(root);
    root.querySelector("#qAdd").onclick=()=>{q.steps.push({id:uid(),title:"",prevu:1,contenu:""});draw(root)};
    root.querySelector("#qSave").onclick=()=>{q.level=root.querySelector("#qLevel").value.trim();q.title=root.querySelector("#qTitle").value.trim()||"Séquence sans titre";
      q.steps=q.steps.filter(s=>String(s.title).trim());S.sequences=S.sequences.filter(x=>x.id!==q.id);S.sequences.push(q);
      root.querySelectorAll("#qCls input").forEach(cb=>{const c=cls(cb.value);if(cb.checked)c.seqId=q.id;else if(c.seqId===q.id)c.seqId=""});
      save();close();tab="classes";render()};
    const d=root.querySelector("#qDel");if(d){let armed=false;d.onclick=()=>{if(!armed){armed=true;d.textContent="Confirmer";return}
      S.sequences=S.sequences.filter(x=>x.id!==q.id);S.classes.forEach(c=>{if(c.seqId===q.id)c.seqId=""});save();close();render()}}
  });
}

const libs={};
function loadScript(src){return libs[src]||(libs[src]=new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>{delete libs[src];ko(new Error("load"))};document.head.appendChild(s)}))}
async function docxText(file){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
  const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return r.value}
async function pdfText(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
  const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  let out="";for(let i=1;i<=Math.min(pdf.numPages,15);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();out+=tc.items.map(x=>x.str+(x.hasEOL?"\n":" ")).join("")+"\n"}
  return out}
const PROMPT=`Tu reçois une fiche de séquence d'arts plastiques (collège ou lycée, France), rédigée par l'enseignant.
Extrais le déroulé de la séquence en ÉTAPES pour un suivi de progression.
Règles :
- Une étape = un moment pédagogique (incitation, analyse d'œuvre, recherches, expérimentation, production, mise en espace, verbalisation, évaluation…).
- Si plusieurs séances consécutives portent sur la même activité, regroupe-les en une seule étape et mets leur nombre dans "prevu".
- Si la fiche ne donne pas le nombre de séances d'une étape, mets 1.
- "title" : 2 à 5 mots. "contenu" : une phrase de 120 caractères au plus, ce qui est prévu concrètement.
- "level" : le niveau de classe (ex. "6e", "5e", "2nde"), chaîne vide s'il n'apparaît pas. "title" de la séquence : son titre ou sa problématique courte.
Réponds uniquement avec ce JSON :
{"level":"","title":"","steps":[{"title":"","prevu":1,"contenu":""}]}`;
function importManual(){
  const h=head("Importer une séquence")+`
  <div class="note">L'IA n'est pas intégrée à cette version. Faites préparer les étapes par Claude, puis collez sa réponse ici.</div>
  <div class="steps-on" style="display:flex">
   <div class="onb"><span class="k">1</span><span style="flex:1;min-width:0"><b>Copier la consigne</b><br><button class="btn sm" id="mCopy" style="margin-top:6px">Copier la consigne</button> <span class="note" id="mCopyMsg"></span></span></div>
   <div class="onb"><span class="k">2</span><span style="flex:1;min-width:0"><b>Dans Claude</b><br><span class="note">Collez la consigne et joignez votre fiche de séquence (Word, PDF ou photo).</span></span></div>
   <div class="onb"><span class="k">3</span><span style="flex:1;min-width:0"><b>Coller la réponse ici</b><br><span class="note">Copiez toute la réponse de Claude, y compris les accolades.</span></span></div>
  </div>
  <textarea id="mPrompt" readonly hidden></textarea>
  <label class="f">Réponse de Claude<textarea id="mJson" placeholder='{"level":"5e","title":"…","steps":[…]}'></textarea></label>
  <div id="mMsg" class="note" role="status"></div>
  <div class="row"><button class="btn pri" id="mGo" style="flex:1">Vérifier les étapes</button></div>
  <button class="btn" id="mManual">Saisir la séquence à la main</button>`;
  open(h,root=>{
    const pr=root.querySelector("#mPrompt");pr.value=PROMPT+"\n\nLa fiche est jointe à ce message.";
    root.querySelector("#mCopy").onclick=()=>{const m=root.querySelector("#mCopyMsg");
      const fb=()=>{pr.hidden=false;pr.select();m.textContent="Texte sélectionné : copiez-le."};
      try{navigator.clipboard.writeText(pr.value).then(()=>m.textContent="Copiée.",fb)}catch(e){fb()}};
    root.querySelector("#mManual").onclick=()=>seqSheet(null);
    root.querySelector("#mGo").onclick=()=>{
      const raw=root.querySelector("#mJson").value;const a=raw.indexOf("{"),b=raw.lastIndexOf("}");
      try{const r=JSON.parse(raw.slice(a,b+1));if(!Array.isArray(r.steps)||!r.steps.length)throw 0;
        seqSheet(null,{id:uid(),level:String(r.level||""),title:String(r.title||""),steps:r.steps.map(s=>({id:uid(),title:String(s.title||"").slice(0,80),prevu:Math.max(1,parseInt(s.prevu)||1),contenu:String(s.contenu||"").slice(0,200)})).filter(s=>s.title)})}
      catch(e){const m=root.querySelector("#mMsg");m.style.color="var(--bad)";m.textContent="La réponse n'a pas été reconnue. Copiez-la en entier, depuis la première accolade { jusqu'à la dernière }."}};
  });
}
function importSheet2(){
  if(!(window.claude&&window.claude.use)){importManual();return}
  const h=head("Importer une séquence")+`
  <div class="note">Joignez votre fiche de séquence ou de pilotage. L'IA en tire les étapes et le nombre de séances prévues ; vous vérifiez avant d'enregistrer.</div>
  <div class="drop"><b>Fiche Word, PDF ou photo</b><input type="file" id="iFile" accept=".docx,.pdf,.txt,.md,image/*"><span class="note">Une photo de la fiche papier fonctionne aussi.</span></div>
  <label class="f">Ou collez le texte de la fiche<textarea id="iText" placeholder="Titre, niveau, déroulé séance par séance…"></textarea></label>
  <div id="iMsg" class="note" role="status"></div>
  <div class="row"><button class="btn pri" id="iGo" style="flex:1">Proposer les étapes</button></div>
  <button class="btn" id="iManual">Saisir la séquence à la main</button>`;
  open(h,root=>{
    const msg=(t,bad)=>{const m=root.querySelector("#iMsg");m.innerHTML=t;m.style.color=bad?"var(--bad)":""};
    root.querySelector("#iManual").onclick=()=>seqSheet(null);
    let sample=null;
    root.querySelector("#iGo").onclick=async()=>{
      const go=root.querySelector("#iGo");
      const file=root.querySelector("#iFile").files[0];let text=root.querySelector("#iText").value.trim();let images;
      if(!file&&!text){msg("Joignez une fiche ou collez son texte.",true);return}
      sample=sample||await claude.use("sample").catch(()=>null);
      if(!sample){msg("L'IA n'est pas disponible dans cette vue. Saisissez la séquence à la main.",true);return}
      go.disabled=true;
      try{
        if(file){
          msg('<span class="spin"></span> Lecture de la fiche…');
          const name=file.name.toLowerCase();
          if(name.endsWith(".docx"))text=await docxText(file);
          else if(name.endsWith(".pdf"))text=await pdfText(file);
          else if(file.type.startsWith("image/")){const lim=await sample.limits().catch(()=>null);
            if(!lim||!lim.images){msg("Les photos ne peuvent pas être envoyées ici. Collez plutôt le texte de la fiche.",true);go.disabled=false;return}
            images=[file]}
          else text=await file.text();
          if(!images&&text.trim().length<40){msg("Ce fichier ne contient pas de texte lisible (PDF scanné ?). Essayez avec une photo de la fiche.",true);go.disabled=false;return}
        }
        msg('<span class="spin"></span> L\'IA prépare les étapes…');
        const input=PROMPT+(text?"\n\nFICHE :\n"+text.slice(0,40000):"\n\nLa fiche est jointe en image.");
        const r=await sample.json(input,images?{images,modelTier:"default"}:{modelTier:"default"});
        if(!r||!Array.isArray(r.steps)||!r.steps.length)throw {code:"empty"};
        const draft={id:uid(),level:String(r.level||""),title:String(r.title||""),steps:r.steps.map(s=>({id:uid(),title:String(s.title||"").slice(0,80),prevu:Math.max(1,parseInt(s.prevu)||1),contenu:String(s.contenu||"").slice(0,200)})).filter(s=>s.title)};
        seqSheet(null,draft);
      }catch(e){
        go.disabled=false;
        const code=e&&e.code;
        msg(code==="not_granted"?"L'accès à l'IA a été refusé. Vous pouvez saisir la séquence à la main."
          :code==="rate_limited"?"Trop de demandes d'un coup. Réessayez dans une minute."
          :code==="empty"||code==="invalid_json"?"L'IA n'a pas trouvé d'étapes dans cette fiche. Vérifiez qu'il s'agit bien du déroulé de la séquence."
          :e&&e.message==="load"?"Impossible d'ouvrir ce fichier ici. Collez son texte à la place."
          :"La proposition n'a pas abouti. Réessayez ou collez le texte de la fiche.",true);
      }
    };
  });
}

function classSheet(id){
  const orig=id&&cls(id);const c=orig?{...orig}:{id:uid(),name:"",level:"",seqId:"",color:COLORS[S.classes.length%COLORS.length]};
  const h=head(orig?"Classe":"Nouvelle classe")+`
  <div class="grid2"><label class="f">Nom<input type="text" id="cName" value="${esc(c.name)}" placeholder="4e1"></label><label class="f">Niveau<input type="text" id="cLevel" value="${esc(c.level)}" placeholder="4e"></label></div>
  <label class="f">Séquence en cours<select id="cSeq"><option value="">Aucune</option>${S.sequences.map(q=>`<option value="${q.id}" ${q.id===c.seqId?"selected":""}>${esc(q.level)} · ${esc(q.title)}</option>`).join("")}</select></label>
  <div class="f" style="font-size:13px;font-weight:700;color:var(--muted)">Couleur<div class="row" id="cCol">${COLORS.map(x=>`<button type="button" data-c="${x}" aria-label="Couleur" style="width:34px;height:34px;border-radius:50%;border:3px solid ${x===c.color?"var(--fg)":"transparent"};background:${x}"></button>`).join("")}</div></div>
  <div class="note">Changer de séquence fait repartir la classe sur la nouvelle séquence. L'historique est conservé.</div>
  <div class="row"><button class="btn pri" id="cSave" style="flex:1">Enregistrer</button>${orig?`<button class="btn danger" id="cDel">Supprimer</button>`:""}</div>
  ${orig?"":`<button class="btn" id="cMore">Enregistrer et ajouter une autre classe</button>`}`;
  open(h,root=>{
    root.querySelectorAll("#cCol button").forEach(b=>b.onclick=()=>{c.color=b.dataset.c;root.querySelectorAll("#cCol button").forEach(x=>x.style.borderColor=x===b?"var(--fg)":"transparent")});
    const store=()=>{const n=root.querySelector("#cName").value.trim();if(!n){root.querySelector("#cName").focus();return false}
      c.name=n;c.level=root.querySelector("#cLevel").value.trim()||(n.match(/^\d+e|^2nde|^1re|^Tle/i)||[""])[0];c.seqId=root.querySelector("#cSeq").value;
      S.classes=S.classes.filter(x=>x.id!==c.id);S.classes.push(c);save();return true};
    root.querySelector("#cSave").onclick=()=>{if(store()){close();render()}};
    const m=root.querySelector("#cMore");if(m)m.onclick=()=>{if(store()){render();classSheet(null)}};
    const d=root.querySelector("#cDel");if(d){let armed=false;d.onclick=()=>{if(!armed){armed=true;d.textContent="Confirmer";return}
      S.classes=S.classes.filter(x=>x.id!==c.id);S.slots=S.slots.filter(s=>s.classId!==c.id);save();close();render()}}
  });
}

function slotSheet(id,preset){
  const orig=id&&slotById(id);const s=orig?{...orig}:Object.assign({id:uid(),day:1,start:"08:00",end:"09:00",classId:S.classes[0].id,week:"AB",room:""},preset||{});
  const h=head(orig?"Créneau":"Nouveau créneau")+`
  <label class="f">Jour<select id="sDay">${[1,2,3,4,5,6].map(d=>`<option value="${d}" ${d===s.day?"selected":""}>${DAYS[d]}</option>`).join("")}</select></label>
  <div class="grid2"><label class="f">Début<input type="time" id="sStart" value="${s.start}"></label><label class="f">Fin<input type="time" id="sEnd" value="${s.end}"></label></div>
  <div class="grid2"><label class="f">Classe<select id="sClass">${S.classes.map(c=>`<option value="${c.id}" ${c.id===s.classId?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label><label class="f">Salle<input type="text" id="sRoom" value="${esc(s.room)}"></label></div>
  ${seg("week",[["AB","A et B"],["A","Semaine A"],["B","Semaine B"]],s.week)}
  <div class="row"><button class="btn pri" id="sSave" style="flex:1">Enregistrer</button>${orig?`<button class="btn danger" id="sDel">Supprimer</button>`:""}</div>
  ${orig?"":`<button class="btn" id="sMore">Enregistrer et ajouter le créneau suivant</button>`}`;
  open(h,root=>{
    segWire(root);
    const store=()=>{Object.assign(s,{day:+root.querySelector("#sDay").value,start:root.querySelector("#sStart").value,end:root.querySelector("#sEnd").value,classId:root.querySelector("#sClass").value,room:root.querySelector("#sRoom").value.trim(),week:segVal(root,"week")});
      if(!s.start||!s.end)return false;S.slots=S.slots.filter(x=>x.id!==s.id);S.slots.push(s);save();return true};
    root.querySelector("#sSave").onclick=()=>{if(store()){close();render()}};
    const m=root.querySelector("#sMore");if(m)m.onclick=()=>{if(store()){render();
      const len=(+s.end.slice(0,2)*60+ +s.end.slice(3))-(+s.start.slice(0,2)*60+ +s.start.slice(3));const e=+s.end.slice(0,2)*60+ +s.end.slice(3)+len;
      slotSheet(null,{day:s.day,start:s.end,end:pad(Math.floor(e/60)%24)+":"+pad(e%60),week:s.week,room:s.room})}};
    const d=root.querySelector("#sDel");if(d)d.onclick=()=>{S.slots=S.slots.filter(x=>x.id!==s.id);save();close();render()};
  });
}

function exportSheet(){
  const data=JSON.stringify(S);
  open(head("Sauvegarde")+`<textarea id="xData" readonly style="min-height:140px;font-size:12px">${esc(data)}</textarea><div class="note" id="xMsg">Collez ce texte dans une note pour le conserver.</div>
  <button class="btn pri" id="xCopy">Copier</button>`,root=>{
    root.querySelector("#xCopy").onclick=()=>{const ta=root.querySelector("#xData");
      const fb=()=>{ta.select();root.querySelector("#xMsg").textContent="Texte sélectionné : utilisez Copier dans le menu."};
      try{navigator.clipboard.writeText(data).then(()=>root.querySelector("#xMsg").textContent="Sauvegarde copiée.",fb)}catch(e){fb()}};
  });
}
function restoreSheet(){
  open(head("Restaurer")+`<label class="f">Collez une sauvegarde<textarea id="rData" style="min-height:140px;font-size:12px"></textarea></label><div class="note" id="rMsg">Les données actuelles seront remplacées.</div>
  <button class="btn pri" id="rGo">Restaurer</button>`,root=>{
    root.querySelector("#rGo").onclick=()=>{try{const d=JSON.parse(root.querySelector("#rData").value);if(!d.settings||!d.slots)throw 0;
      S=Object.assign(blank(),d);delete S.examples;save();close();render()}
      catch(e){root.querySelector("#rMsg").textContent="Ce texte n'est pas une sauvegarde valide. Vérifiez qu'il a été copié en entier."}};
  });
}

/* ---------- événements ---------- */
tabsEl.onclick=e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;window.scrollTo(0,0);render()}};
app.onclick=e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="prev"){weekMon=addDays(weekMon,-7);render()}
  else if(a==="next"){weekMon=addDays(weekMon,7);render()}
  else if(a==="today"){weekMon=startWeek();render()}
  else if(a==="flip"){const f=S.settings.flip||(S.settings.flip={});if(f[weekMon])delete f[weekMon];else f[weekMon]=true;save();render()}
  else if(a==="course")courseSheet(b.dataset.slot,b.dataset.date);
  else if(a==="task")taskSheet(b.dataset.id);
  else if(a==="newtask")taskSheet(null);
  else if(a==="editseq")seqSheet(b.dataset.id);
  else if(a==="newseq")seqSheet(null);
  else if(a==="importseq")importSheet2();
  else if(a==="editclass")classSheet(b.dataset.id);
  else if(a==="newclass")classSheet(null);
  else if(a==="editslot")slotSheet(b.dataset.id);
  else if(a==="gotoslots"||a==="newslot"){if(!S.classes.length)classSheet(null);else{if(a==="gotoslots"){tab="reglages";render()}slotSheet(null)}}
  else if(a==="export")exportSheet();
  else if(a==="import")restoreSheet();
  else if(a==="dlbackup"){const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const u=URL.createObjectURL(blob);const l=document.createElement("a");l.href=u;l.download="semainier-"+TODAY+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  else if(a==="ulbackup"){const inp=document.getElementById("ulFile");inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());if(!d.settings||!d.slots)throw 0;S=Object.assign(blank(),d);save();render();open(head("Sauvegarde restaurée")+`<div>Les données du fichier ${esc(f.name)} ont remplacé les précédentes.</div><button class="btn pri" data-act="close">OK</button>`)}
    catch(e){open(head("Fichier non reconnu")+`<div>Ce fichier n'est pas une sauvegarde du semainier.</div><button class="btn" data-act="close">OK</button>`)}inp.value=""};inp.click()}
};
layer.addEventListener("click",e=>{const b=e.target.closest('[data-act="close"]');if(b&&(b.classList.contains("scrim")?e.target===b:true))close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
render();
connect().catch(()=>{});
})();
